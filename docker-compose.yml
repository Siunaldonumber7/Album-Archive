services:
  album-archive:
    build: .
    container_name: album-archive
    restart: unless-stopped
    ports:
      - "5050:5001"
    environment:
      ALBUM_DB_PATH: /data/albums.db
      PYTHONUNBUFFERED: "1"
      ALBUM_BACKGROUND_MAINTENANCE: "1"
      TZ: Asia/Seoul
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/healthz', timeout=2).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
