<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 로그인 · My Archive</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#f5f5f7;color:#171719;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
.card{width:min(100%,390px);padding:30px;border:1px solid rgba(0,0,0,.07);border-radius:26px;background:rgba(255,255,255,.9);box-shadow:0 24px 70px rgba(0,0,0,.09)}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:28px;text-decoration:none;color:inherit;font-weight:850}
.icon{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:11px;background:#fa2d48;color:#fff;font-size:20px;box-shadow:0 7px 19px rgba(250,45,72,.22)}
h1{margin:0;font-size:28px;letter-spacing:-1.2px}
p{margin:9px 0 24px;color:#7b7b81;font-size:13px;line-height:1.6}
label{display:block;margin-bottom:8px;color:#666;font-size:11px;font-weight:800}
input{width:100%;height:48px;padding:0 14px;border:1px solid rgba(0,0,0,.08);border-radius:13px;background:#f3f3f5;outline:none;font-size:18px;letter-spacing:3px;text-align:center}
input:focus{background:#fff;box-shadow:0 0 0 3px rgba(250,45,72,.09)}
button{width:100%;height:48px;margin-top:12px;border:0;border-radius:13px;background:#171719;color:#fff;font-size:14px;font-weight:800;cursor:pointer}
.error{margin:0 0 14px;padding:11px 13px;border-radius:11px;background:#fff0f1;color:#c6253c;font-size:12px;font-weight:700}
.back{display:block;margin-top:18px;text-align:center;color:#8b8b91;text-decoration:none;font-size:12px}
</style>
</head>
<body>
<div class="card">
  <a class="brand" href="{{ url_for('index') }}">
    <span class="icon">♫</span>
    <span>My Archive</span>
  </a>

  <h1>관리자 로그인</h1>
  <p>앨범 등록·수정·삭제 기능은 관리자 PIN으로 보호됩니다.</p>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form method="POST" action="{{ url_for('admin_login') }}">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <label>ADMIN PIN</label>
    <input
      type="password"
      name="pin"
      inputmode="numeric"
      autocomplete="current-password"
      maxlength="16"
      autofocus
      required
    >
    <button type="submit">관리자 메뉴 들어가기</button>
  </form>

  <a class="back" href="{{ url_for('index') }}">‹ 앨범 화면으로 돌아가기</a>
</div>
</body>
</html>
